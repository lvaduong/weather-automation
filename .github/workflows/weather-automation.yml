name: Weather Automation

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  weather-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tests
        env:
          HEADLESS: "false"
          CITY: Ho Chi Minh City
          COUNTRY: Vietnam
          PARALLEL_DAY_WORKERS: "1"
          STRICT_AUTOMATION_FAILURES: "true"
          RETRY_ATTEMPTS: "1"
          DEFAULT_TIMEOUT_MS: "15000"
          PAGE_LOAD_TIMEOUT_MS: "5000"
        run: xvfb-run -a python run_tests.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: weather-report
          path: reports/
